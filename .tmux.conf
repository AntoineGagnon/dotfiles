# iTerm2-style splits and navigation
# Register raw escape sequences as user-defined keys, then bind them.
# iTerm2 must send these sequences — see setup instructions below.


set -s user-keys[0] "\033[25~"   # Cmd+D       → split right
set -s user-keys[1] "\033[26~"   # Cmd+Shift+D → split down
set -s user-keys[2] "\033[31~"   # Cmd+Opt+Left
set -s user-keys[3] "\033[32~"   # Cmd+Opt+Right
set -s user-keys[4] "\033[33~"   # Cmd+Opt+Up
set -s user-keys[5] "\033[34~"   # Cmd+Opt+Down

bind-key -n User0 split-window -h
bind-key -n User1 split-window -v
bind-key -n User2 select-pane -L
bind-key -n User3 select-pane -R
bind-key -n User4 select-pane -U
bind-key -n User5 select-pane -D

# Status bar
set -g status-interval 1
set -g status-position bottom
set -g status-style "bg=#b5d5b5,fg=#2a4a2a"

set -g status-left "#[bg=#4a8a4a,fg=#ffffff,bold] #S #[bg=#b5d5b5,fg=#4a8a4a] "
set -g status-left-length 30

set -g window-status-format " #I:#W "
set -g window-status-style "fg=#2a4a2a"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#2a6a2a,fg=#ffffff,bold"
set -g window-status-separator ""

set -g status-right " #[fg=#4a8a4a]#h#[fg=#2a4a2a]  %H:%M  %d %b "
set -g status-right-length 50

set -g pane-border-style "fg=#7aba7a"
set -g pane-active-border-style "fg=#3a7a3a"

set -g mouse

# --- iTerm2 setup (one-time, manual) ---
# In iTerm2 → Settings → Keys → Key Bindings:
#
# REMOVE the existing Cmd+D and Cmd+Shift+D entries, then ADD:
#
#   Keystroke        Action                  Value
#   Cmd+D            Send Escape Sequence    [25~
#   Cmd+Shift+D      Send Escape Sequence    [26~
#   Cmd+Opt+Left     Send Escape Sequence    [31~
#   Cmd+Opt+Right    Send Escape Sequence    [32~
#   Cmd+Opt+Up       Send Escape Sequence    [33~
#   Cmd+Opt+Down     Send Escape Sequence    [34~
#
# Also disable macOS Mission Control shortcuts for Cmd+Opt+Left/Right
# at: System Settings → Keyboard → Keyboard Shortcuts → Mission Control

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'b0o/tmux-autoreload'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
